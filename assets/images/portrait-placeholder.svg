<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07060a" />
      <stop offset="50%" stop-color="#120c18" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>

    <radialGradient id="redGlow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#820317" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="silverChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8c93a0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2a2e39" stop-opacity="0.2" />
    </linearGradient>

    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Crimson Ambient Lighting Aura -->
  <circle cx="520" cy="360" r="380" fill="url(#redGlow)" />

  <!-- Fine Technical Coordinate Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1000" />
    <line x1="720" y1="0" x2="720" y2="1000" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="880" x2="800" y2="880" />
    <circle cx="400" cy="480" r="260" stroke-dasharray="4,8" />
    <circle cx="400" cy="480" r="320" stroke="rgba(255,26,64,0.12)" stroke-dasharray="2,12" />
  </g>

  <!-- High-Fashion Silhouette & Abstract Face Art -->
  <g transform="translate(400, 480)">
    <!-- Shoulders Silhouette -->
    <path d="M-280,480 C-260,350 -160,260 -60,240 L60,240 C160,260 260,350 280,480 Z" fill="#0d0b13" stroke="rgba(255,26,64,0.2)" stroke-width="1.5" />
    
    <!-- Neck -->
    <path d="M-60,240 L-50,110 L50,110 L60,240 Z" fill="#13101c" stroke="rgba(255,255,255,0.06)" />

    <!-- Head & Jaw Contour (Editorial Profile Outline) -->
    <path d="M-110,60 C-125,-60 -115,-180 -10,-240 C100,-250 145,-160 140,-50 C135,50 90,130 0,165 C-70,140 -100,100 -110,60 Z" 
          fill="#161220" stroke="url(#silverChrome)" stroke-width="1.5" />

    <!-- Neon Crimson Rim Lighting on Head Edge -->
    <path d="M10,-240 C100,-250 145,-160 140,-50 C135,50 90,130 0,165" 
          fill="none" stroke="#ff1a40" stroke-width="3" filter="url(#cinematicGlow)" />

    <!-- Ethereal Celestial Eye Graphic -->
    <g transform="translate(15, -40)" stroke="#ff1a40" stroke-width="1.5" fill="none">
      <path d="M-40,0 C-20,-18 20,-18 40,0 C20,18 -20,18 -40,0 Z" />
      <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#cinematicGlow)" />
      <circle cx="0" cy="0" r="2.5" fill="#ff1a40" />
      <line x1="-55" y1="0" x2="55" y2="0" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2,4" />
    </g>

    <!-- Starboy Cross / Celestial Star Motif on Ear/Jaw -->
    <g transform="translate(95, 30)">
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffffff" stroke-width="2" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#ff1a40" filter="url(#cinematicGlow)" />
    </g>

    <!-- Flowing Hair / Cosmic Waves -->
    <path d="M-110,-120 C-180,-60 -210,60 -190,200 C-180,270 -130,340 -90,390" fill="none" stroke="rgba(255,26,64,0.3)" stroke-width="2" />
    <path d="M-130,-70 C-210,0 -240,140 -210,290" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <path d="M120,-110 C190,-40 220,90 200,240 C190,310 140,380 90,430" fill="none" stroke="rgba(255,26,64,0.4)" stroke-width="2" />
  </g>

  <!-- Editorial HUD Data Overlay -->
  <text x="90" y="80" fill="#ff1a40" font-family="'Space Mono', monospace" font-size="12" letter-spacing="3">SPECIMEN // STARGIRL 01</text>
  <text x="90" y="100" fill="rgba(255,255,255,0.4)" font-family="'Space Mono', monospace" font-size="10" letter-spacing="2">LAT 43.6532° N // LONG 79.3832° W</text>

  <text x="710" y="80" text-anchor="end" fill="rgba(255,255,255,0.6)" font-family="'Space Mono', monospace" font-size="12" letter-spacing="3">STATUS: CONSTELLATION LOCKED</text>
  <text x="710" y="100" text-anchor="end" fill="#ff1a40" font-family="'Space Mono', monospace" font-size="10" letter-spacing="2">RED SHIFT: +0.48 nm</text>

  <!-- Editorial Instruction Stamp -->
  <g transform="translate(400, 840)">
    <rect x="-180" y="-22" width="360" height="44" fill="rgba(6,6,10,0.85)" stroke="rgba(255,26,64,0.4)" rx="2" />
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Space Grotesk', sans-serif" font-weight="700" font-size="11" letter-spacing="3">INSERT YOUR PHOTOGRAPH HERE</text>
    <text x="0" y="16" text-anchor="middle" fill="rgba(255,26,64,0.9)" font-family="'Space Mono', monospace" font-size="8" letter-spacing="1">OR PRESERVE AS EDITORIAL AVATAR</text>
  </g>
</svg>

