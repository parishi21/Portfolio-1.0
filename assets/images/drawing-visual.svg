<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a080d" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>
    <radialGradient id="charcoalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#3d0510" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030305" stop-opacity="0" />
    </radialGradient>
    <filter id="brushGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#artBg)" />
  <circle cx="400" cy="250" r="260" fill="url(#charcoalGlow)" />

  <!-- Drafting Compass Circles & Golden Ratio Curves -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
    <circle cx="400" cy="250" r="180" stroke-dasharray="3,6" />
    <circle cx="400" cy="250" r="110" />
    <circle cx="400" cy="250" r="50" stroke="#ff1a40" stroke-opacity="0.4" />
    <line x1="120" y1="250" x2="680" y2="250" stroke-dasharray="2,4" />
    <line x1="400" y1="50" x2="400" y2="450" stroke-dasharray="2,4" />
  </g>

  <!-- Dramatic Charcoal / Paint Stroke (Curved Expressive Ribbon) -->
  <path d="M140,380 C260,390 320,160 420,150 C520,140 580,360 690,180" 
        fill="none" stroke="#ff1a40" stroke-width="8" stroke-linecap="round" filter="url(#brushGlow)" />
  
  <path d="M130,365 C250,375 310,145 410,135 C510,125 570,345 680,165" 
        fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" />

  <!-- Celestial Iris / Eye of Vision -->
  <g transform="translate(400, 250)">
    <!-- Eye shape -->
    <path d="M-100,0 C-50,-55 50,-55 100,0 C50,55 -50,55 -100,0 Z" 
          fill="rgba(14, 12, 22, 0.9)" stroke="#ffffff" stroke-width="1.8" />
    
    <!-- Red glowing iris -->
    <circle cx="0" cy="0" r="32" fill="#08070e" stroke="#ff1a40" stroke-width="2" filter="url(#brushGlow)" />
    <circle cx="0" cy="0" r="16" fill="#ff1a40" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    
    <!-- Starburst highlights -->
    <line x1="-28" y1="0" x2="28" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="0" y1="-28" x2="0" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  </g>

  <!-- Artistic Technical Notation -->
  <text x="80" y="80" fill="#ff1a40" font-family="'Space Mono', monospace" font-size="11" letter-spacing="3">MEDIUM // CHARCOAL &amp; DIGITAL VECTOR</text>
  <text x="80" y="100" fill="rgba(255,255,255,0.4)" font-family="'Space Mono', monospace" font-size="10">CANVAS 03 — VISUALIZING UNSEEN PERSPECTIVES</text>

  <text x="720" y="80" text-anchor="end" fill="rgba(255,255,255,0.5)" font-family="'Space Mono', monospace" font-size="11" letter-spacing="2">03 // ARTWORK</text>
</svg>

