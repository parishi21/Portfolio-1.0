<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08070d" />
      <stop offset="50%" stop-color="#140614" />
      <stop offset="100%" stop-color="#030305" />
    </linearGradient>
    <radialGradient id="uiGlow" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#820317" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030305" stop-opacity="0" />
    </radialGradient>
    <filter id="glassCardGlow">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#webBg)" />
  <circle cx="500" cy="200" r="280" fill="url(#uiGlow)" />

  <!-- Multi-Layered Floating UI Viewports (Perspective Stacking) -->
  
  <!-- Back Layer Viewport -->
  <g transform="translate(160, 90)">
    <rect width="440" height="260" rx="4" fill="rgba(12, 10, 18, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    <line x1="0" y1="30" x2="440" y2="30" stroke="rgba(255, 255, 255, 0.06)" />
    <circle cx="20" cy="15" r="3.5" fill="#52525b" />
    <circle cx="34" cy="15" r="3.5" fill="#52525b" />
    <circle cx="48" cy="15" r="3.5" fill="#52525b" />
  </g>

  <!-- Middle Layer Viewport (Desktop Glass Canvas) -->
  <g transform="translate(190, 120)">
    <rect width="460" height="280" rx="4" fill="rgba(18, 15, 26, 0.85)" stroke="rgba(255, 26, 64, 0.35)" stroke-width="1.5" />
    <!-- Browser Nav Header -->
    <rect width="460" height="34" rx="4" fill="rgba(24, 20, 34, 0.95)" />
    <circle cx="20" cy="17" r="4" fill="#ff1a40" />
    <circle cx="36" cy="17" r="4" fill="#ffffff" opacity="0.4" />
    <circle cx="52" cy="17" r="4" fill="#ffffff" opacity="0.2" />
    <rect x="80" y="8" width="220" height="18" rx="2" fill="rgba(6, 6, 10, 0.6)" stroke="rgba(255,255,255,0.06)" />
    <text x="92" y="21" fill="rgba(255,255,255,0.4)" font-family="'Space Mono', monospace" font-size="9">https://stargirl.space</text>

    <!-- Editorial Web Layout Prototype Inside -->
    <!-- Large Hero Heading Blocks -->
    <rect x="40" y="60" width="180" height="22" rx="2" fill="#ffffff" />
    <rect x="40" y="90" width="130" height="18" rx="2" fill="#ff1a40" filter="url(#glassCardGlow)" />
    <!-- Subtitle Line -->
    <rect x="40" y="125" width="220" height="7" rx="1" fill="rgba(255,255,255,0.25)" />
    <rect x="40" y="140" width="180" height="7" rx="1" fill="rgba(255,255,255,0.15)" />
    <!-- CTA Button -->
    <rect x="40" y="165" width="80" height="24" rx="2" fill="#ff1a40" />

    <!-- Feature Grid Placeholders -->
    <rect x="290" y="60" width="130" height="140" rx="3" fill="rgba(30, 24, 42, 0.7)" stroke="rgba(255,26,64,0.3)" />
    <circle cx="355" cy="120" r="28" fill="none" stroke="#ff1a40" stroke-width="2" stroke-dasharray="3,5" />
  </g>

  <!-- Front Layer (Mobile Phone Viewport) -->
  <g transform="translate(540, 160)">
    <rect width="130" height="260" rx="14" fill="#0b0912" stroke="#ffffff" stroke-width="2" filter="url(#glassCardGlow)" />
    <!-- Dynamic Island / Speaker -->
    <rect x="42" y="8" width="46" height="8" rx="4" fill="#1b1625" />
    <!-- Content inside mobile screen -->
    <rect x="15" y="35" width="100" height="70" rx="4" fill="rgba(255,26,64,0.18)" stroke="#ff1a40" stroke-width="1" />
    <rect x="15" y="118" width="80" height="10" rx="2" fill="#ffffff" />
    <rect x="15" y="136" width="60" height="8" rx="1" fill="#ff1a40" />
    <rect x="15" y="152" width="100" height="5" rx="1" fill="rgba(255,255,255,0.3)" />
    <rect x="15" y="164" width="90" height="5" rx="1" fill="rgba(255,255,255,0.2)" />
    <rect x="15" y="185" width="100" height="24" rx="2" fill="#ff1a40" />
  </g>

  <!-- Responsive Device Connectors -->
  <path d="M430,280 L540,280" fill="none" stroke="#ff1a40" stroke-width="1.5" stroke-dasharray="3,4" />
  <circle cx="430" cy="280" r="3" fill="#ff1a40" />
  <circle cx="540" cy="280" r="3" fill="#ffffff" />

  <!-- Technical Overlay -->
  <text x="80" y="80" fill="#ff1a40" font-family="'Space Mono', monospace" font-size="11" letter-spacing="3">UI/UX // ARCHITECTURE &amp; INTERACTIVE EXPERIENCES</text>
  <text x="80" y="100" fill="rgba(255,255,255,0.4)" font-family="'Space Mono', monospace" font-size="10">SYNTHESIZING PIXELS, MOTION &amp; LUXURY EDITORIAL DESIGN</text>

  <text x="720" y="80" text-anchor="end" fill="rgba(255,255,255,0.5)" font-family="'Space Mono', monospace" font-size="11" letter-spacing="2">08 // CRAFT</text>
</svg>
